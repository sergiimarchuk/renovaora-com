{{define "content"}}
<h1>Articles</h1>
<a href="/admin/articles/new" class="btn btn-success">New Article</a>

<table>
    <thead>
        <tr>
            <th>Title</th>
            <th>Slug</th>
            <th>Status</th>
            <th>Created</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {{range .Articles}}
        <tr>
            <td>{{.Title}}</td>
            <td>{{.Slug}}</td>
            <td><span class="status-badge status-{{.Status}}">{{.Status}}</span></td>
            <td>{{.CreatedAt.Format "2006-01-02 15:04"}}</td>
            <td>
                <a href="/admin/articles/{{.ID}}" class="btn">View</a>
                <a href="/admin/articles/{{.ID}}/edit" class="btn">Edit</a>
                <form action="/admin/articles/{{.ID}}/delete" method="POST" style="display:inline;">
                    <button type="submit" class="btn btn-danger" onclick="return confirm('Delete this article?')">Delete</button>
                </form>
            </td>
        </tr>
        {{end}}
    </tbody>
</table>
{{end}}
