{{define "content"}}
<h1>Edit Media</h1>

<form method="POST" action="/admin/media/{{.Media.ID}}/update">
    <div class="form-group">
        <label>Filename</label>
        <input type="text" value="{{.Media.Filename}}" disabled>
    </div>
    <div class="form-group">
        <label>Alt Text</label>
        <input type="text" name="alt_text" value="{{.Media.AltText}}">
    </div>
    <div class="form-group">
        <label>Caption</label>
        <input type="text" name="caption" value="{{.Media.Caption}}">
    </div>
    <button type="submit" class="btn btn-success">Save</button>
    <a href="/admin/media" class="btn">Cancel</a>
</form>
{{end}}
