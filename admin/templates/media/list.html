{{define "content"}}
<h1>Media</h1>

<h2>Upload New File</h2>
<form method="POST" action="/admin/media/upload" enctype="multipart/form-data">
    <div class="form-group">
        <label>File</label>
        <input type="file" name="file" required>
    </div>
    <div class="form-group">
        <label>Entity Type</label>
        <select name="entity_type">
            <option value="page">Page</option>
            <option value="article">Article</option>
        </select>
    </div>
    <div class="form-group">
        <label>Entity ID</label>
        <input type="number" name="entity_id" required>
    </div>
    <div class="form-group">
        <label>Alt Text</label>
        <input type="text" name="alt_text">
    </div>
    <div class="form-group">
        <label>Caption</label>
        <input type="text" name="caption">
    </div>
    <button type="submit" class="btn btn-success">Upload</button>
</form>

<hr>

<h2>Media List</h2>
<table>
    <thead>
        <tr>
            <th>Filename</th>
            <th>Entity</th>
            <th>Alt Text</th>
            <th>Created</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody>
        {{range .Media}}
        <tr>
            <td>{{.Filename}}</td>
            <td>{{.EntityType}} #{{.EntityID}}</td>
            <td>{{.AltText}}</td>
            <td>{{.CreatedAt.Format "2006-01-02 15:04"}}</td>
            <td>
                <a href="/admin/media/{{.ID}}/edit" class="btn">Edit</a>
                <form action="/admin/media/{{.ID}}/delete" method="POST" style="display:inline;">
                    <button type="submit" class="btn btn-danger" onclick="return confirm('Delete this file?')">Delete</button>
                </form>
            </td>
        </tr>
        {{end}}
    </tbody>
</table>
{{end}}
