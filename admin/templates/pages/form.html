{{define "content"}}
<h1>{{if .Page.ID}}Edit{{else}}New{{end}} Page</h1>

<form method="POST" action="{{if .Page.ID}}/admin/pages/{{.Page.ID}}/update{{else}}/admin/pages{{end}}">
    <div class="form-group">
        <label>Title</label>
        <input type="text" name="title" value="{{.Page.Title}}" required>
    </div>
    <div class="form-group">
        <label>Slug</label>
        <input type="text" name="slug" value="{{.Page.Slug}}" placeholder="auto-generated from title">
    </div>
    <div class="form-group">
        <label>Body (Markdown)</label>
        <textarea name="body">{{.Page.BodyMarkdown}}</textarea>
    </div>
    <div class="form-group">
        <label>Status</label>
        <select name="status">
            <option value="draft" {{if eq .Page.Status "draft"}}selected{{end}}>Draft</option>
            <option value="published" {{if eq .Page.Status "published"}}selected{{end}}>Published</option>
        </select>
    </div>
    <button type="submit" class="btn btn-success">Save</button>
    <a href="/admin/pages" class="btn">Cancel</a>
</form>
{{end}}
