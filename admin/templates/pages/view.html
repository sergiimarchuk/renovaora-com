{{define "content"}}
<h1>{{.Page.Title}}</h1>
<p><strong>Slug:</strong> {{.Page.Slug}}</p>
<p><strong>Status:</strong> <span class="status-badge status-{{.Page.Status}}">{{.Page.Status}}</span></p>
<p><strong>Created:</strong> {{.Page.CreatedAt.Format "2006-01-02 15:04"}}</p>
{{if .Page.PublishedAt}}
<p><strong>Published:</strong> {{.Page.PublishedAt.Format "2006-01-02 15:04"}}</p>
{{end}}
<hr>
<pre>{{.Page.BodyMarkdown}}</pre>
<a href="/admin/pages/{{.Page.ID}}/edit" class="btn">Edit</a>
<a href="/admin/pages" class="btn">Back</a>
{{end}}
