{{define "base"}}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{template "title" .}} | Renovaora</title>
    <!-- Tailwind CSS v4 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-gray-900 font-sans min-h-screen flex flex-col justify-between">
    <!-- White header with centered menu -->
    <header class="border-b border-gray-100 py-6 bg-white sticky top-0 z-50">
        <nav class="flex justify-center items-center space-x-14 text-sm font-medium tracking-wide">
            <a href="/" class="text-blue-600 hover:text-blue-800 transition">Home</a>
            <a href="/about" class="text-gray-600 hover:text-blue-600 transition">About</a>

            <!-- Contacts с выпадающим подменю -->
            <div class="relative group">
                <button class="text-gray-600 hover:text-blue-600 transition flex items-center gap-1">
                    Contacts
                    <svg class="w-3 h-3 mt-0.5 transition-transform group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                </button>
                <div class="absolute left-1/2 -translate-x-1/2 top-full pt-3 hidden group-hover:block z-50">
                    <div class="bg-white border border-gray-100 rounded-xl shadow-lg py-2 w-56">
                        <a href="mailto:info@renovaora.com" class="block px-4 py-2 text-sm text-gray-600 hover:bg-gray-50 hover:text-blue-600 transition">
                            Send Email
                        </a>
                        <a href="https://wa.me/1234567890" target="_blank" rel="noopener" class="block px-4 py-2 text-sm text-gray-600 hover:bg-gray-50 hover:text-blue-600 transition">
                            WhatsApp Us
                        </a>
                        <a href="/contacts#message" class="block px-4 py-2 text-sm text-gray-600 hover:bg-gray-50 hover:text-blue-600 transition">
                            Leave a Message
                        </a>
                    </div>
                </div>
            </div>

            <a href="/login" class="bg-gray-900 text-white px-4 py-2 rounded-xl text-sm font-semibold hover:bg-gray-800 transition shadow-sm">Login</a>
        </nav>
    </header>
    <!-- Centered content wrapper -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 py-12">
        <div class="w-full flex justify-center">
            {{template "main" .}}
        </div>
    </main>
    <!-- Footer -->
    <footer class="border-t border-gray-100 py-6 text-center text-sm text-gray-400 bg-white">
        &copy; 2026 Renovaora.com. All rights reserved.
    </footer>
</body>
</html>
{{end}}
