{{define "title"}}Home{{end}}
{{define "main"}}
<div class="relative w-full -mt-6 -mx-4 sm:mx-0">
    <div class="relative w-full h-[180px] sm:h-[220px] md:h-[260px] lg:h-[300px] overflow-hidden">
        <img
            src="/static/images/hero-tower.png"
            alt="Renovaora — restoration craftsmen at the Leaning Tower of Pisa"
            class="absolute inset-0 w-full h-full object-cover object-top"
        >
        <div class="absolute inset-0"
             style="background: linear-gradient(to bottom, transparent 40%, rgba(255,255,255,0.9) 80%, #ffffff 100%);">
        </div>
        <div class="absolute inset-x-0 bottom-0 flex flex-col items-center pb-2 sm:pb-3 px-4">
            <h1 class="text-2xl sm:text-3xl md:text-4xl font-extrabold tracking-tight mb-2 bg-gradient-to-r from-green-600 via-gray-800 to-red-600 bg-clip-text text-transparent">
                Renovaora
            </h1>
            <div class="flex justify-center gap-1">
                <span class="w-6 sm:w-8 h-1 rounded-full bg-green-600"></span>
                <span class="w-6 sm:w-8 h-1 rounded-full bg-gray-200"></span>
                <span class="w-6 sm:w-8 h-1 rounded-full bg-red-600"></span>
            </div>
        </div>
    </div>
    <div class="max-w-2xl text-center mx-auto px-4 pt-4 pb-4">
        <p class="text-base sm:text-lg md:text-xl text-gray-500 mb-6 whitespace-nowrap" style="word-spacing: 0.3em;">
            Transforming houses, flats, and villas into perfection
        </p>
        <a href="/about" class="inline-block bg-blue-600 text-white px-6 py-3 rounded-xl font-semibold shadow-md hover:bg-blue-700 transition">
            Get Started
        </a>
    </div>
</div>
{{end}}
