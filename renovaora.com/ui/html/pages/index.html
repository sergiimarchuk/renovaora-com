{{define "title"}}Home{{end}}
{{define "main"}}
<div class="relative w-full -mt-6 -mx-4 sm:mx-0">
    <div class="w-full flex justify-center bg-cover bg-top bg-no-repeat"
         style="background-image: url('/static/images/hero-tower.png'); aspect-ratio: 1024 / 900;">
        <div class="w-full flex flex-col items-center justify-end pb-6 px-4"
             style="background: linear-gradient(to bottom, transparent 55%, rgba(255,255,255,0.85) 80%, #ffffff 100%);">
            <h1 class="text-5xl font-extrabold tracking-tight mb-4 mt-auto bg-gradient-to-r from-green-600 via-gray-800 to-red-600 bg-clip-text text-transparent">
                Renovaora
            </h1>
            <div class="flex justify-center gap-1 mb-2">
                <span class="w-10 h-1.5 rounded-full bg-green-600"></span>
                <span class="w-10 h-1.5 rounded-full bg-gray-200"></span>
                <span class="w-10 h-1.5 rounded-full bg-red-600"></span>
            </div>
        </div>
    </div>
    <div class="max-w-2xl text-center mx-auto px-4 pb-4">
        <p class="text-xl text-gray-500 max-w-md mx-auto mb-8">
            A clean, white, and minimalist template with a perfectly centered navigation layout.
        </p>
        <a href="/about" class="inline-block bg-blue-600 text-white px-6 py-3 rounded-xl font-semibold shadow-md hover:bg-blue-700 transition">
            Get Started
        </a>
    </div>
</div>
{{end}}
